{% extends "base.html" %}
{% block title %}设备详情 - 光储充管理系统{% endblock %}

{% block content %}
<style>
    .detail-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px 30px;
    }
    .detail-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 16px 0 20px 0;
        border-bottom: 2px solid #f0f2f5;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 12px;
    }
    .detail-header .back-link {
        color: #4f8cf7;
        text-decoration: none;
        font-size: 14px;
    }
    .detail-header .back-link:hover {
        text-decoration: underline;
    }
    .detail-header h1 {
        margin: 8px 0 2px 0;
        font-size: 26px;
        font-weight: 700;
        color: #1a2332;
    }
    .detail-header .subtitle {
        margin: 0;
        color: #8c9aab;
        font-size: 14px;
    }
    .detail-header .header-right {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
    }
    .detail-header .type-badge {
        background: #f0f4f9;
        padding: 4px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 500;
        color: #3d4e62;
    }
    .detail-header .status-badge.online {
        padding: 4px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        background: #e8f5e9;
        color: #2e7d32;
    }
    .detail-header .status-badge.offline {
        padding: 4px 16px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        background: #fce4ec;
        color: #c62828;
    }

    .realtime-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 12px 24px;
        background: #ffffff;
        border: 1px solid #eef2f6;
        border-radius: 12px;
        padding: 18px 22px;
        margin-bottom: 24px;
    }
    .realtime-item {
        display: flex;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid #f7f8fa;
    }
    .realtime-item:last-child {
        border-bottom: none;
    }
    .realtime-item .label {
        color: #7a8a9b;
        font-size: 14px;
    }
    .realtime-item .value {
        font-weight: 600;
        color: #1a2332;
        font-size: 14px;
    }
    .realtime-item .value .unit {
        font-weight: 400;
        color: #8c9aab;
        font-size: 13px;
        margin-left: 2px;
    }

    .strategy-params {
        background: #f8fafc;
        border: 1px solid #eef2f6;
        border-radius: 12px;
        padding: 18px 22px;
        margin-bottom: 24px;
    }
    .strategy-params h3 {
        margin: 0 0 12px 0;
        font-size: 16px;
        color: #1a2332;
    }
    .strategy-params .param-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 8px 20px;
    }
    .strategy-params .param-item {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
        font-size: 14px;
    }
    .strategy-params .param-item .plabel {
        color: #7a8a9b;
    }
    .strategy-params .param-item .pvalue {
        font-weight: 500;
        color: #1a2332;
    }

    .control-section {
        background: #ffffff;
        border: 1px solid #eef2f6;
        border-radius: 12px;
        padding: 18px 22px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
    }
    .control-section .ctrl-btn {
        padding: 10px 28px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s;
    }
    .control-section .ctrl-btn.start {
        background: #10b981;
        color: white;
    }
    .control-section .ctrl-btn.start:hover {
        background: #059669;
    }
    .control-section .ctrl-btn.stop {
        background: #ef4444;
        color: white;
    }
    .control-section .ctrl-btn.stop:hover {
        background: #dc2626;
    }
    .control-section .ctrl-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    .control-section .ctrl-status {
        font-size: 14px;
        color: #6b7a8c;
    }

    .history-section {
        background: #ffffff;
        border: 1px solid #eef2f6;
        border-radius: 12px;
        padding: 18px 22px;
    }
    .history-section h3 {
        margin: 0 0 12px 0;
        font-size: 16px;
        color: #1a2332;
    }
    .history-section canvas {
    width: 100% !important;
    height: 250px !important;
    max-height: 300px;
    }
    .history-section .no-data {
        text-align: center;
        color: #8c9aab;
        padding: 30px 0;
    }
    .loading-placeholder {
        text-align: center;
        color: #b0bec5;
        padding: 40px 0;
    }
</style>

<div class="detail-container">
    <div class="detail-header">
        <div>
            <a href="/devices" class="back-link">← 返回设备列表</a>
            <h1 id="detailDeviceName">设备详情</h1>
            <p class="subtitle" id="detailDeviceCode">编码: --</p>
        </div>
        <div class="header-right">
            <span class="type-badge" id="detailDeviceType">--</span>
            <span class="status-badge online" id="detailOnlineStatus">在线</span>
        </div>
    </div>

    <div class="realtime-grid" id="realtimeGrid">
        <div class="loading-placeholder" style="grid-column:1/-1;">加载中...</div>
    </div>

    <div class="strategy-params" id="strategyParams">
        <h3>📋 策略配置（来自 B）</h3>
        <div class="param-grid" id="strategyParamGrid">
            <div class="param-item"><span class="plabel">参与策略</span><span class="pvalue" id="spParticipate">--</span></div>
            <div class="param-item"><span class="plabel">允许策略控制</span><span class="pvalue" id="spAllowControl">--</span></div>
            <div class="param-item"><span class="plabel">策略功率上限</span><span class="pvalue" id="spPowerLimit">--</span></div>
            <div class="param-item"><span class="plabel">优先级</span><span class="pvalue" id="spPriority">--</span></div>
        </div>
    </div>

    <div class="control-section" id="controlSection" style="display:none;">
        <span class="ctrl-status" id="ctrlStatus">当前状态: --</span>
        <button class="ctrl-btn start" id="ctrlStartBtn">▶️ 启动</button>
        <button class="ctrl-btn stop" id="ctrlStopBtn">⏹ 停止</button>
    </div>

    <div class="history-section">
        <h3>📈 24h 功率曲线</h3>
        <canvas id="historyChart"></canvas>
        <div class="no-data" id="historyNoData">暂无历史数据</div>
    </div>
</div>

<script src="/static/js/device_detail.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
{% endblock %}
